FF%3B%22%20points=%22170.001%2C210%20190.001%2C210%20270%2C210%20270%2C180%20190.001%2C180%20170.001%2C180%20%22/%3E%20%3Cpolygon%20id=%22XMLID_1258_%22%20style=%22fill:%23FFFFFF%3B%22%20points=%22140.001%2C150%20190.001%2C150%20240.001%2C150%20240.001%2C120%20190.001%2C120%20140.001%2C120%20%22/%3E%20%3Cpolygon%20id=%22XMLID_1259_%22%20style=%22fill:%2378B9EB%3B%22%20points=%22189.999%2C30%20175.001%2C30%20110.001%2C30%2080.001%2C30%2040%2C30%2040%2C30%2040%2C90%2040%2C90%20189.999%2C90%20%22/%3E%20%3Cpolygon%20id=%22XMLID_1260_%22%20style=%22fill:%235A8BB0%3B%22%20points=%22189.999%2C90%20190.001%2C90%20340%2C90%20340%2C30%20300%2C30%20300%2C0%20270%2C0%20270%2C30%20205.001%2C30%20205.001%2C0%20175.001%2C0%20175.001%2C30%20189.999%2C30%20%22/%3E%20%3C/g%3E%20%3C/svg%3E">
<style>
/* ============================================================
   TOKENS — Material 3
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  /* Light — M3 baseline (blue seed) */
  --bg: #f8fafd;
  --bg-deep: #f8fafd;
  --surface: #ffffff;
  --col: #f0f4f9;
  --card: #ffffff;
  --pop: #ffffff;
  --menu: #ffffff;
  --well: #f0f4f9;
  --surface-2: #f0f4f9;
  --surface-3: #dde3ea;
  --text: #1f1f1f;
  --muted: #444746;
  --border: #e1e5ea;
  --outline: #747775;
  --accent: #0b57d0;
  --accent-hover: #0a4cb8;
  --accent-soft: #d3e3fd;
  --on-accent: #ffffff;
  --on-soft: #041e49;
  --danger: #b3261e;
  --danger-soft: #f9dedc;
  --on-danger: #ffffff;
  --success: #146c2e;
  --on-success: #ffffff;
  --chart-1: #0b57d0;
  --chart-2: #9334e6;
  --chart-3: #188038;
  --chart-4: #8e918f;
  --state-hover: rgba(11,87,208,.08);
  --state-press: rgba(11,87,208,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.08);
  --shadow: 0 2px 8px rgba(0,0,0,.10);
  --shadow-lg: 0 6px 24px rgba(0,0,0,.16);
  --scrim: rgba(0,0,0,.32);
  --radius: 16px;
  --sb-thumb: rgba(0,0,0,.2);
  --sb-thumb-hover: rgba(0,0,0,.4);
}

html[data-theme="dark"] {
  /* Dark — M3 neutral surfaces on #131314 */
  --bg: #131314;
  --bg-deep: #131314;
  --surface: #1e1f20;
  --col: #1e1f20;
  --card: #282a2c;
  --pop: #1e1f20;
  --menu: #2b2d30;
  --well: #282a2c;
  --surface-2: #282a2c;
  --surface-3: #37393b;
  --text: #e3e3e3;
  --muted: #c4c7c5;
  --border: #333537;
  --outline: #8e918f;
  --accent: #a8c7fa;
  --accent-hover: #c2d7fb;
  --accent-soft: #2b4170;
  --on-accent: #062e6f;
  --on-soft: #d3e3fd;
  --danger: #f2b8b5;
  --danger-soft: #4a2220;
  --on-danger: #601410;
  --success: #6dd58c;
  --on-success: #00391a;
  --chart-1: #a8c7fa;
  --chart-2: #d7aefb;
  --chart-3: #81c995;
  --chart-4: #8e918f;
  --state-hover: rgba(168,199,250,.08);
  --state-press: rgba(168,199,250,.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow: 0 2px 8px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.55);
  --scrim: rgba(0,0,0,.55);
  --sb-thumb: rgba(255,255,255,.17);
  --sb-thumb-hover: rgba(255,255,255,.34);
}

/* ============================================================
   BASE
   ============================================================ */
html, body { height: 100%; margin: 0; }
body {
  font-family: 'Google Sans', 'Google Sans Text', Roboto, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
  letter-spacing: .1px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pad { padding: 8px 4px; }

/* Hide native scrollbars wherever the custom one is used */
[data-csb], textarea.input {
  scrollbar-width: none;
  -ms-overflow-style: none;
}
[data-csb]::-webkit-scrollbar, textarea.input::-webkit-scrollbar { display: none; width: 0; height: 0; }

/* ============================================================
   CUSTOM SCROLLBAR
   ============================================================ */
.csb {
  position: fixed;
  z-index: 150;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
  border-radius: 999px;
}
.csb.visible { opacity: 1; pointer-events: auto; }
.csb-y { width: 12px; }
.csb-x { height: 12px; }
.csb-thumb {
  position: absolute;
  border-radius: 999px;
  background: var(--sb-thumb);
  transition: background .15s ease;
}
.csb-y .csb-thumb { left: 3px; width: 6px; top: 0; }
.csb-x .csb-thumb { top: 3px; height: 6px; left: 0; }
.csb:hover .csb-thumb,
.csb.dragging .csb-thumb { background: var(--sb-thumb-hover); }

/* ============================================================
   SPLASH
   ============================================================ */
.splash {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
  transition: opacity .25s ease;
}
.splash.hide { opacity: 0; pointer-events: none; }
.splash-spinner {
  width: 36px; height: 36px;
  border: 4px solid var(--accent-soft);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
.splash p { color: var(--muted); font-size: 14px; margin: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   TOP APP BAR
   ============================================================ */
.navbar {
  height: 68px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  background: var(--bg);
  z-index: 40;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 500; font-size: 22px; letter-spacing: 0;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  cursor: pointer;
  padding: 6px 12px;
  margin-left: -12px;
  border-radius: 999px;
  transition: background .15s ease;
}
.brand:hover { background: var(--state-hover); }
.brand:active { background: var(--state-press); }
.brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.brand-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent);
  flex: none;
}
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  border: 0; background: transparent; color: var(--muted);
  height: 40px; padding: 0 20px; border-radius: 999px; cursor: pointer;
  font-size: 14px; font-weight: 500; letter-spacing: .1px; transition: background .15s, color .15s;
}
.nav-tab:hover { background: var(--state-hover); color: var(--text); }
.nav-tab.active { background: var(--accent-soft); color: var(--on-soft); }
.nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 22px; border-radius: 999px;
  border: 1px solid var(--outline);
  background: transparent; color: var(--accent);
  font-size: 14px; font-weight: 500; letter-spacing: .1px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--state-hover); }
.btn:active { background: var(--state-press); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent); box-shadow: var(--shadow-sm); filter: brightness(1.06); }
.btn.primary:active { filter: brightness(.95); }
.btn.danger { color: var(--danger); border-color: var(--outline); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.btn.danger-solid:hover { background: var(--danger); filter: brightness(1.06); box-shadow: var(--shadow-sm); }
.btn.block { width: 100%; }
.btn.sm { height: 32px; padding: 0 16px; font-size: 13px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 14px; }
.btn.ghost:hover { background: var(--state-hover); }
.btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }

.icon-btn {
  width: 36px; height: 36px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 0;
  background: transparent; color: var(--muted);
  cursor: pointer; transition: background .15s, color .15s; padding: 0;
}
.icon-btn:hover { background: var(--state-hover); color: var(--text); }
.icon-btn:active { background: var(--state-press); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }
.ico { display: inline-flex; align-items: center; justify-content: center; }
.ico svg { display: block; }

/* ============================================================
   INPUTS — outlined text fields
   ============================================================ */
.input, textarea.input, select.input {
  width: 100%; padding: 12px 16px;
  border-radius: 12px; border: 1px solid var(--outline);
  background: transparent; color: var(--text);
  font-size: 14px; font-family: inherit;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
select.input option { background: var(--pop); color: var(--text); }
.input::placeholder { color: var(--muted); opacity: .7; }
.input:hover { border-color: var(--text); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.input.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
textarea.input { resize: vertical; min-height: 84px; line-height: 1.5; }
.input.error { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.field-label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .4px; }
.field-error { color: var(--danger); font-size: 12px; }
.field-row { display: flex; gap: 8px; align-items: stretch; }
.field-row .input { flex: 1; min-width: 0; }

/* Switch */
.switch { position: relative; display: inline-block; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-track {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--surface-3); border: 2px solid var(--outline);
  transition: background .2s, border-color .2s; cursor: pointer;
}
.switch-thumb {
  position: absolute; top: 6px; left: 6px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--outline);
  transition: all .2s ease;
}
.switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .switch-track .switch-thumb {
  transform: none; left: 22px; top: 2px; width: 24px; height: 24px; background: var(--on-accent);
}
.switch input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled + .switch-track { opacity: .38; }

/* ============================================================
   MAIN / VIEWS
   ============================================================ */
main { flex: 1; min-height: 0; position: relative; }
.view { height: 100%; }
#view-home { overflow: hidden; }
#view-trash, #view-settings { overflow-y: auto; }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 32px; gap: 6px;
}
.empty-icon {
  width: 80px; height: 80px; border-radius: 28px;
  background: var(--accent-soft); color: var(--on-soft);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.empty-state h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0; }
.empty-state p { margin: 4px 0 20px; color: var(--muted); max-width: 440px; line-height: 1.6; font-size: 14px; }

/* ============================================================
   GROUPS STRIP
   ============================================================ */
.groups-strip {
  display: flex;
  gap: 16px;
  height: 100%;
  padding: 4px 24px 24px;
  overflow-x: auto;
  overflow-y: hidden;
}

.group-col {
  flex: 0 0 372px;
  width: 372px;
  height: 100%;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--col);
  border-radius: 28px;
  overflow: hidden;
}

.group-head { padding: 20px 20px 12px; flex: none; }
.group-head-top { display: flex; align-items: flex-start; gap: 8px; }
.group-name {
  margin: 0; font-size: 20px; font-weight: 500; letter-spacing: 0;
  flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.35;
}
.group-desc {
  margin: 6px 0 0; font-size: 13px; color: var(--muted);
  line-height: 1.5; overflow-wrap: anywhere;
}
.group-desc.placeholder { font-style: italic; opacity: .7; }

.group-tools { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.group-tools .spacer { flex: 1; }

.tool-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--outline); background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background .15s, color .15s; max-width: 140px;
}
.tool-btn:hover { background: var(--state-hover); color: var(--text); }
.tool-btn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-btn.active { color: var(--on-soft); border-color: transparent; background: var(--accent-soft); }

.group-head .btn.block { margin-top: 12px; }

.group-body {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 4px 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.group-empty {
  padding: 28px 12px; text-align: center; color: var(--muted);
  font-size: 13px; line-height: 1.6;
}

/* ============================================================
   ENTRIES — filled cards
   ============================================================ */
.entry {
  background: var(--card);
  border-radius: 16px;
  cursor: pointer;
  transition: box-shadow .15s, background-color .15s;
  overflow: hidden;
  flex: none;
  position: relative;
}
.entry:hover { box-shadow: var(--shadow); }
.entry::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: var(--state-hover); opacity: 0; pointer-events: none; transition: opacity .15s;
}
.entry:hover::after { opacity: 1; }
.entry:active::after { background: var(--state-press); opacity: 1; }
.entry.is-done { opacity: .6; }
.entry.is-done .entry-title { text-decoration: line-through; }

.entry-thumb { width: 100%; height: 140px; background: var(--surface-2); overflow: hidden; }
.entry-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.entry-main { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.entry-top { display: flex; align-items: flex-start; gap: 10px; }
.entry-title {
  flex: 1; min-width: 0; font-size: 15px; font-weight: 500;
  line-height: 1.4; overflow-wrap: anywhere;
}
.entry-desc {
  font-size: 13px; color: var(--muted); line-height: 1.5;
  overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.entry-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.done-check {
  width: 20px; height: 20px; flex: none; margin-top: 1px;
  border-radius: 50%; border: 2px solid var(--outline);
  background: transparent; color: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0; font-size: 11px; line-height: 1;
  transition: .15s; position: relative; z-index: 1;
}
.done-check:hover { border-color: var(--accent); }
.done-check.checked {
  background: var(--success); border-color: var(--success); color: var(--on-success);
}
.done-check.checked svg { display: block; }

.entry-more {
  width: 28px; height: 28px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 0; background: transparent;
  color: var(--muted); cursor: pointer; padding: 0;
  position: relative; z-index: 1;
}
.entry-more:hover { background: var(--state-press); color: var(--text); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 8px;
  background: var(--accent-soft); color: var(--on-soft);
  font-size: 12px; font-weight: 500; line-height: 1.5;
  max-width: 100%;
}
.chip .chip-x {
  border: 0; background: transparent; color: inherit; cursor: pointer;
  padding: 0; margin-left: 2px; font-size: 14px; line-height: 1; opacity: .7;
}
.chip .chip-x:hover { opacity: 1; }
.chip.sm { font-size: 11px; padding: 2px 8px; }
.chip.plain { background: var(--surface-2); color: var(--muted); }
.chip.voice { background: var(--surface-3); color: var(--muted); }
.chip.trunc { max-width: 160px; overflow: hidden; }

/* Countdown */
.countdown { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.cd-bar { height: 4px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.cd-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s linear; }
.countdown.overdue .cd-fill { background: var(--danger); }
.cd-text { font-size: 11px; color: var(--muted); line-height: 1.4; }
.countdown.overdue .cd-text { color: var(--danger); font-weight: 500; }

/* ============================================================
   MENUS (popovers)
   ============================================================ */
.popover {
  position: fixed; z-index: 200;
  background: var(--menu);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  padding: 8px;

}

<script>
/* ============================================================
   LISTLY — with IndexedDB persistence
   ------------------------------------------------------------
   All app data lives in memory in the `State` object. Changes

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

function h(tag, attrs, ...children) {

      if (k === 'class') el.className = v;

      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);

  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false || c === true) continue;

function truncate(str, n) {
  if (!str) return '';
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}

function countdownText(dueIso) {
  const due = new Date(dueIso).getTime();
  const now = Date.now();
  let diff = due - now;
  const overdue = diff < 0;
  diff = Math.abs(diff);
  const d = Math.floor(diff / 86400000);
  const hh = Math.floor((diff % 86400000) / 3600000);
  const mm = Math.floor((diff % 3600000) / 60000);
  const ss = Math.floor((diff % 60000) / 1000);
  const parts = [];
  if (d) parts.push(d + 'd');
  if (d || hh) parts.push(hh + 'h');
  parts.push(mm + 'm');
  if (!d) parts.push(ss + 's');
  return (overdue ? 'Overdue by ' : '') + parts.join(' ') + (overdue ? '' : ' left');
}

function toast(msg, type) {
  const root = document.getElementById('toast-root');
  const el = h('div', { class: 'toast' + (type ? ' ' + type : '') }, msg);
