function confirmDeleteGroup(group) {
  confirmDialog({
    title: 'Delete group?',
    message: `“${group.name}” and its ${group.entries.length} entr${group.entries.length === 1 ? 'y' : 'ies'} will be moved to the Trash. You can restore them within 30 days.`,
    confirmText: 'Move to Trash',
    danger: true,
    onConfirm: () => {
      State.groups = State.groups.filter(g => g.id !== group.id);
      const trashItem = {
        id: uid(),
        type: 'group',
        deletedAt: new Date().toISOString(),
        data: group
      };
      State.trash.push(trashItem);
      markGroupDeleted(group.id);
      touchTrash(trashItem.id);
      save();
      renderApp();
      toast('Group moved to Trash');
    }
  });
}

/* ============================================================
   TRASH VIEW
   ============================================================ */
const TRASH_LIFETIME_MS = 30 * 24 * 60 * 60 * 1000;

function daysLeft(deletedAt) {
  const left = TRASH_LIFETIME_MS - (Date.now() - new Date(deletedAt).getTime());
  return Math.max(0, Math.ceil(left / 86400000));
}

function renderTrash(container) {
  const page = h('div', { class: 'page' });

  const head = h('div', { class: 'page-head' }, h('h1', {}, 'Trash'));

  if (State.trash.length) {
    const restoreAll = h('button', { class: 'btn', type: 'button' }, iconEl('restore', 15), 'Restore All');
    restoreAll.addEventListener('click', () => {
      let restored = 0, skipped = 0;
      const remaining = [];
      State.trash.forEach(item => {
        if (item.type === 'group') {
          State.groups.push(item.data);
          touchGroup(item.data.id);
          markTrashDeleted(item.id);
          restored++;
        } else {
          const g = getGroup(item.groupId);
          if (g) {
            g.entries.push(item.data);
            touchGroup(g.id);
            markTrashDeleted(item.id);
            restored++;
          } else {
            skipped++;
            remaining.push(item);
          }
        }
      });
      State.trash = remaining;
      save();
      renderApp();
      toast(`Restored ${restored} item${restored === 1 ? '' : 's'}${skipped ? `, ${skipped} skipped (group gone)` : ''}`);
    });

    const wipeAll = h('button', { class: 'btn danger', type: 'button' }, iconEl('trash', 15), 'Delete All Permanently');
    wipeAll.addEventListener('click', () => {
      confirmDialog({
        title: 'Delete everything permanently?',
        message: `All ${State.trash.length} item(s) in the Trash will be permanently deleted. This cannot be undone.`,
        confirmText: 'Delete Forever',
        danger: true,
        onConfirm: () => {
          State.trash.forEach(t => markTrashDeleted(t.id));
          markTrashCleared();
          State.trash = [];
          save();
          renderApp();
          toast('Trash emptied');
        }
      });
    });

    head.append(restoreAll, wipeAll);
  }

  page.append(head);

  if (!State.trash.length) {
    page.append(h('div', { class: 'empty-state', style: { height: 'auto', paddingTop: '70px' } },
      h('div', { class: 'empty-icon' }, iconEl('trash', 26)),
      h('h2', {}, 'Trash is empty'),
      h('p', {}, 'Deleted groups and entries land here and stay for 30 days before being removed automatically.')
    ));
    container.append(page);
    return;
  }

  const sorted = State.trash.slice().sort((a, b) => new Date(b.deletedAt) - new Date(a.deletedAt));

  sorted.forEach(item => {
    const isGroup = item.type === 'group';
    const data = item.data;

    const restoreBtn = h('button', { class: 'btn sm', type: 'button' }, iconEl('restore', 13), 'Restore');
    restoreBtn.addEventListener('click', () => {
      if (isGroup) {
        State.groups.push(data);
        touchGroup(data.id);
      } else {
        const g = getGroup(item.groupId);
        if (!g) { toast('Original group no longer exists', 'error'); return; }
        g.entries.push(data);
        touchGroup(g.id);
      }
      State.trash = State.trash.filter(t => t.id !== item.id);
      markTrashDeleted(item.id);
      save();
      renderApp();
      toast('Restored');
    });

    const permBtn = h('button', { class: 'btn sm danger', type: 'button' }, iconEl('trash', 13), 'Delete');
    permBtn.addEventListener('click', () => {
      confirmDialog({
        title: 'Delete permanently?',
        message: `“${data.name}” will be gone forever. This cannot be undone.`,
        confirmText: 'Delete Forever',
        danger: true,
        onConfirm: () => {
          State.trash = State.trash.filter(t => t.id !== item.id);
          markTrashDeleted(item.id);
          save();
          renderApp();
          toast('Deleted permanently');
        }
      });
    });

    const metaBits = [
      h('span', {}, 'Deleted ' + fmtDate(item.deletedAt)),
      h('span', {}, daysLeft(item.deletedAt) + ' day(s) left')
    ];
    if (isGroup) {
      metaBits.unshift(h('span', {}, data.entries.length + ' entr' + (data.entries.length === 1 ? 'y' : 'ies')));
    } else if (item.groupName) {
      metaBits.unshift(h('span', {}, 'From “' + item.groupName + '”'));
    }

    page.append(h('div', { class: 'list-card' },
      h('div', { class: 'lc-main' },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '3px' } },
          h('span', { class: 'badge' + (isGroup ? ' group' : '') }, isGroup ? 'Group' : 'Entry')
        ),
        h('div', { class: 'lc-title' }, data.name),
        h('div', { class: 'lc-desc' }, data.description ? data.description : 'No description'),
        h('div', { class: 'lc-meta' }, metaBits.map((b, i) => i ? [h('span', { class: 'muted' }, '·'), b] : b))
      ),
      h('div', { class: 'lc-actions' }, restoreBtn, permBtn)
    ));
  });

  container.append(page);
}

/* ============================================================
   SETTINGS VIEW
   ============================================================ */
const STORAGE_QUOTA_BYTES = 50 * 1024 * 1024; // fallback estimate

function scanGroupInto(group, acc) {
  acc.text.push(JSON.stringify({
    n: group.name, d: group.description, t: group.tags,
    c: group.createdAt, u: group.updatedAt, f: group.fields
  }));
  group.entries.forEach(e => {
    (e.images || []).forEach(i => { acc.photos += i.length; });
    if (e.voice) acc.voice += e.voice.length;
    acc.text.push(JSON.stringify({
      n: e.name, d: e.description, t: e.tags, c: e.countdown,
      url: e.url, loc: e.location,
      done: e.done, ca: e.createdAt, ua: e.updatedAt
    }));
  });
}

function estimateStorage() {
  const active = { photos: 0, voice: 0, text: [] };
  State.groups.forEach(g => scanGroupInto(g, active));

  const trash = { photos: 0, voice: 0, text: [] };
  State.trash.forEach(item => {
    if (item.type === 'group') {
      scanGroupInto(item.data, trash);
    } else {
      const e = item.data;
      (e.images || []).forEach(i => { trash.photos += i.length; });
      if (e.voice) trash.voice += e.voice.length;
      trash.text.push(JSON.stringify({
        n: e.name, d: e.description, t: e.tags, c: e.countdown,
        url: e.url, loc: e.location,
        done: e.done, ca: e.createdAt, ua: e.updatedAt
      }));
    }
  });

  const activeText = byteSize(active.text.join(''));
  const trashText = byteSize(trash.text.join(''));

  const activeTotal = active.photos + active.voice + activeText;
  const trashTotal = trash.photos + trash.voice + trashText;

  return {
    photos: active.photos + trash.photos,
    voice: active.voice + trash.voice,
    text: activeText + trashText,
    activeTotal,
    trashTotal,
    total: activeTotal + trashTotal,
    free: Math.max(0, STORAGE_QUOTA_BYTES - (activeTotal + trashTotal)),
    quota: STORAGE_QUOTA_BYTES
  };
}

function renderSettings(container) {
  const page = h('div', { class: 'page' });
  page.append(h('div', { class: 'page-head' }, h('h1', {}, 'Settings')));

  /* ---------- Theme ---------- */
  const themeSection = h('div', { class: 'settings-section' },
    h('h2', {}, 'Appearance'),
    h('p', { class: 'hint' }, 'Choose how the app looks. “Device default” follows your system setting.')
  );
  const seg = h('div', { class: 'segmented' });
  [['light', 'Light'], ['dark', 'Dark'], ['device', 'Device default']].forEach(([val, label]) => {
    const b = h('button', { class: val === State.settings.theme ? 'active' : '', type: 'button' }, label);
    b.addEventListener('click', () => {
      State.settings.theme = val;
      applyTheme();
      touchSettings();
      save();
      renderApp();
    });
    seg.append(b);
  });
  themeSection.append(seg);
  page.append(themeSection);

  /* ---------- Storage ---------- */
  const est = estimateStorage();
  const pctActive = Math.min(100, (est.activeTotal / est.quota) * 100);
  const pctTrash = Math.min(100 - pctActive, (est.trashTotal / est.quota) * 100);

  const storageSection = h('div', { class: 'settings-section' },
    h('h2', {}, 'Storage usage'),
    h('p', { class: 'hint' }, 'Estimated space used by everything in the app, stored in IndexedDB. Real numbers appear once the browser reports them.')
  );

  const totalValueEl = h('div', { class: 'stat-value' }, fmtBytes(est.total));
  const freeValueEl = h('div', { class: 'stat-value' }, fmtBytes(est.free));
  const activeValueEl = h('div', { class: 'stat-value' }, fmtBytes(est.activeTotal));
  const trashValueEl = h('div', { class: 'stat-value' }, fmtBytes(est.trashTotal));

  storageSection.append(
    h('div', { class: 'storage-bar' },
      h('div', { class: 'fill-active', style: { width: pctActive + '%' } }),
      h('div', { class: 'fill-trash', style: { width: pctTrash + '%' } })
    ),
    h('div', { class: 'storage-stats' },
      h('div', { class: 'stat' }, h('div', { class: 'stat-label' }, 'TOTAL USED'), totalValueEl),
      h('div', { class: 'stat' }, h('div', { class: 'stat-label' }, 'ACTIVE DATA'), activeValueEl),
      h('div', { class: 'stat' }, h('div', { class: 'stat-label' }, 'IN TRASH'), trashValueEl),
      h('div', { class: 'stat' }, h('div', { class: 'stat-label' }, 'FREE'), freeValueEl)
    )
  );

  const breakdown = h('div', { class: 'breakdown' });
  const totalForBars = Math.max(1, est.total);
  [
    ['Photos', est.photos, 'var(--chart-1)'],
    ['Voice', est.voice, 'var(--chart-2)'],
    ['Text & meta', est.text, 'var(--chart-3)'],
    ['Other', Math.max(0, est.total - est.photos - est.voice - est.text), 'var(--chart-4)']
  ].forEach(([name, val, color]) => {
    breakdown.append(h('div', { class: 'bd-row' },
      h('span', { class: 'bd-dot', style: { background: color } }),
      h('span', { class: 'bd-name' }, name),
      h('div', { class: 'bd-bar' }, h('div', { style: { width: (val / totalForBars * 100) + '%', background: color } })),
      h('span', { class: 'bd-val' }, fmtBytes(val))
    ));
  });
  storageSection.append(breakdown);
  page.append(storageSection);

  /* Async real estimate — update the numeric stats in place */
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(real => {
      if (!document.body.contains(container)) return;
      const usage = real.usage || 0;
      const quota = real.quota || STORAGE_QUOTA_BYTES;
      totalValueEl.textContent = fmtBytes(usage);
      freeValueEl.textContent = fmtBytes(Math.max(0, quota - usage));
    }).catch(() => {});
  }

  /* ---------- Data management ---------- */
  const dm = h('div', { class: 'settings-section' },
    h('h2', {}, 'Data management'),
    h('p', { class: 'hint' }, 'Export a full backup, import data back in, or reset the app completely.')
  );

  const exportBtn = h('button', { class: 'btn', type: 'button' }, iconEl('download', 15), 'Export All Data');
  exportBtn.addEventListener('click', exportAllData);

  const mergeBtn = h('button', { class: 'btn', type: 'button' }, iconEl('upload', 15), 'Import & Merge');
  mergeBtn.addEventListener('click', () => importData('merge'));

  const replaceBtn = h('button', { class: 'btn', type: 'button' }, iconEl('upload', 15), 'Import & Replace');
  replaceBtn.addEventListener('click', () => importData('replace'));

  const resetBtn = h('button', { class: 'btn danger', type: 'button' }, iconEl('alert', 15), 'Factory Reset');
  resetBtn.addEventListener('click', () => {
    confirmDialog({
      title: 'Factory reset?',
      message: 'Every group, entry and trash item will be permanently erased and the app will return to its initial state. This cannot be undone.',
      confirmText: 'Erase Everything',
      danger: true,
      onConfirm: async () => {
        State.groups = [];
        State.trash = [];
        try {
          await DB.clearAll();
          await DB.putSetting('theme', State.settings.theme);
        } catch (err) {
          console.error('[Reset] failed:', err);
        }
        dirty.groups.clear();
        dirty.trash.clear();
        dirty.deletedGroups.clear();
        dirty.deletedTrash.clear();
        dirty.trashCleared = false;
        dirty.settings = false;
        dirty.fullSync = false;
        renderApp();
        toast('App reset');
      }
    });
  });

  dm.append(h('div', { class: 'dm-grid' }, exportBtn, mergeBtn, replaceBtn, resetBtn));
  page.append(dm);

  container.append(page);
}

/* ------------------------------------------------------------
   Export / Import
   ------------------------------------------------------------ */
function exportAllData() {
  const payload = {
    app: 'listly',
    version: 2,
    exportedAt: new Date().toISOString(),
    groups: State.groups,
    trash: State.trash,
    settings: State.settings
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: `listly-backup-${Date.now()}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Backup downloaded');
}

function importData(mode) {
  const input = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
  document.body.append(input);
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) { input.remove(); return; }
    const fr = new FileReader();
    fr.onload = () => {
      input.remove();
      let data;
      try {
        data = JSON.parse(fr.result);
      } catch (e) {
        toast('That file is not valid JSON', 'error');
        return;
      }
      if (!data || !Array.isArray(data.groups)) {
        toast('That file is not a valid app backup', 'error');
        return;
      }

      if (mode === 'replace') {
        State.groups = data.groups;
        State.trash = Array.isArray(data.trash) ? data.trash : [];
        if (data.settings && data.settings.theme) State.settings.theme = data.settings.theme;
        applyTheme();
      } else {
        mergeData(data);
      }

      sanitizeState();
      markFullSync();
      save();
      renderApp();
      toast(mode === 'replace' ? 'Data replaced' : 'Data merged');
    };
    fr.readAsText(file);
  });
  input.click();
}

function mergeData(incoming) {
  (incoming.groups || []).forEach(inGroup => {
    const existing = State.groups.find(g => g.id === inGroup.id);
    if (!existing) {
      State.groups.push(inGroup);
      return;
    }
    existing.name = inGroup.name || existing.name;
    existing.description = inGroup.description || existing.description;
    existing.updatedAt = inGroup.updatedAt || existing.updatedAt;
    (inGroup.entries || []).forEach(inEntry => {
      if (!existing.entries.some(e => e.id === inEntry.id)) {
        existing.entries.push(inEntry);
      }
    });
    (inGroup.tags || []).forEach(t => {
      if (!existing.tags.some(x => x.id === t.id)) existing.tags.push(t);
    });
  });

  (incoming.trash || []).forEach(t => {
    if (!State.trash.some(x => x.id === t.id)) State.trash.push(t);
  });
}

/* ============================================================
   STATE SANITIZER — used after load / import
   ============================================================ */
function sanitizeState() {
  State.groups.forEach(g => {
    if (!g.id) g.id = uid();
    g.entries = g.entries || [];
    g.tags = g.tags || [];
    g.fields = Object.assign({}, DEFAULT_FIELDS, g.fields || {});
    g.fields.name = true;
    if (!g.createdAt) g.createdAt = new Date().toISOString();
    if (!g.updatedAt) g.updatedAt = g.createdAt;
    g.entries.forEach(e => {
      if (!e.id) e.id = uid();
      e.images = e.images || [];
      e.tags = e.tags || [];
      e.done = !!e.done;
      if (typeof e.url !== 'string') e.url = '';
      if (typeof e.location !== 'string') e.location = '';
      if (!e.createdAt) e.createdAt = new Date().toISOString();
      if (!e.updatedAt) e.updatedAt = e.createdAt;
    });
  });
  State.trash = (State.trash || []).filter(t => t && t.id && t.data);
  State.trash.forEach(t => {
    if (!t.deletedAt) t.deletedAt = new Date().toISOString();
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function wireNavigation() {
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentView = tab.dataset.view;
      closePopover();
      renderApp();
    });
  });

  /* Brand → reload the app tab */
  const brand = document.getElementById('brand');
  brand.addEventListener('click', () => location.reload());
  brand.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.reload(); }
  });

  const ng = document.getElementById('new-group-btn');
  ng.replaceChildren(iconEl('plus', 15), document.createTextNode('New Group'));
  ng.addEventListener('click', () => openGroupModal(null));
}

async function boot() {
  const splash = document.getElementById('splash');

  /* --- Load data --- */
  let groups = [], trash = [], theme = 'device';
  let loaded = false;

  if (DB._supported) {
    try {
      await DB.open();
      groups = await DB.getAllGroups();
      trash = await DB.getAllTrash();
      const storedTheme = await DB.getSetting('theme');
      if (storedTheme) theme = storedTheme;
      loaded = true;
    } catch (err) {
      console.error('[Boot] IndexedDB load failed:', err);
      toast('Could not open local storage — data will not be saved.', 'error');
    }
  } else {
    console.warn('[Boot] IndexedDB is not supported in this browser.');
  }

  /* --- One-time migration from old sessionStorage format --- */
  const legacyKey = 'listing-app:session:v1';
  if (loaded && groups.length === 0 && trash.length === 0) {
    const legacy = sessionStorage.getItem(legacyKey);
    if (legacy) {
      try {
        const parsed = JSON.parse(legacy);
        if (parsed && Array.isArray(parsed.groups)) {
          groups = parsed.groups;
          trash = Array.isArray(parsed.trash) ? parsed.trash : [];
          if (parsed.settings && parsed.settings.theme) theme = parsed.settings.theme;
          markFullSync();
          toast('Migrated previous session data');
        }
      } catch (e) { /* ignore */ }
    }
    sessionStorage.removeItem(legacyKey);
  } else if (!loaded) {
    sessionStorage.removeItem(legacyKey);
  }

  /* --- Assign to state --- */
  State.groups = groups;
  State.trash = trash;
  State.settings.theme = theme;

  sanitizeState();

  /* --- Purge trash older than 30 days --- */
  const now = Date.now();
  const expiredIds = [];
  State.trash = State.trash.filter(item => {
    const old = now - new Date(item.deletedAt).getTime() >= TRASH_LIFETIME_MS;
    if (old) expiredIds.push(item.id);
    return !old;
  });
  expiredIds.forEach(id => markTrashDeleted(id));

  applyTheme();
  wireNavigation();
  renderApp();

  /* Persist any boot-time changes (migration, purge, sanitize) */
  if (hasPendingChanges()) flush();

  if (expiredIds.length) {
    toast(`${expiredIds.length} item(s) auto-removed from Trash after 30 days`);
  }

  /* --- Hide splash --- */
  if (splash) {
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 300);
  }
}

/* Kick off boot */
boot();
</script>
