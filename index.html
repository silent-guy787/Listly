  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2500);
}

/* ============================================================
   CUSTOM SCROLLBARS
   ------------------------------------------------------------
   Native scrollbars are hidden on any element carrying a
   `data-csb="x|y"` attribute (or on textareas). A floating
   track + thumb is rendered in <body> and kept in sync with
   the element's geometry via getBoundingClientRect().
   ============================================================ */
const CSB = new Map();
let csbRaf = 0;
let refreshRaf = 0;

function scheduleScrollbars() {
  if (csbRaf) return;
  csbRaf = requestAnimationFrame(() => {
    csbRaf = 0;
    for (const [el, st] of CSB) {
      if (!document.body.contains(el)) { st.destroy(); continue; }
      st.update();
    }
  });
}

function refreshScrollbars() {
  document.querySelectorAll('[data-csb], textarea.input').forEach(el => {
    attachScrollbar(el, el.dataset.csb || 'y');
  });
  scheduleScrollbars();
}

function scheduleRefresh() {
  if (refreshRaf) return;
  refreshRaf = requestAnimationFrame(() => {
    refreshRaf = 0;
    refreshScrollbars();
  });
}

function attachScrollbar(el, axis) {
  const existing = CSB.get(el);
  if (existing) { existing.update(); return existing; }

  const horizontal = axis === 'x';
  const track = document.createElement('div');
  track.className = 'csb csb-' + axis;
  const thumb = document.createElement('div');
  thumb.className = 'csb-thumb';
  track.append(thumb);
  document.body.append(track);

  let hovering = false;
  let dragging = false;
  let hideTimer = null;

  const st = {
    el, axis, track, thumb,

    update() {
      const r = el.getBoundingClientRect();
      const viewport = horizontal ? el.clientWidth : el.clientHeight;
      const content = horizontal ? el.scrollWidth : el.scrollHeight;

      if (r.width < 2 || r.height < 2 || content <= viewport + 1) {
        track.classList.remove('visible');
        track.style.display = 'none';
        return;
      }
      track.style.display = 'block';

      // Keep the scrollbar above the layer its element belongs to
      const layered = el.closest('.overlay, .modal-backdrop, .popover');
      track.style.zIndex = layered ? '500' : '150';

      if (horizontal) {
        track.style.left = r.left + 'px';
        track.style.top = (r.bottom - 12) + 'px';
        track.style.width = r.width + 'px';
        track.style.height = '12px';
      } else {
        track.style.left = (r.right - 12) + 'px';
        track.style.top = r.top + 'px';
        track.style.width = '12px';
        track.style.height = r.height + 'px';
      }

      const trackLen = horizontal ? r.width : r.height;
      const ratio = viewport / content;
      const thumbLen = Math.max(30, Math.min(trackLen, Math.round(trackLen * ratio)));
      const maxTravel = trackLen - thumbLen;
      const scrollMax = content - viewport;
      const scrollPos = horizontal ? el.scrollLeft : el.scrollTop;
      const pos = scrollMax > 0 ? (scrollPos / scrollMax) * maxTravel : 0;

      if (horizontal) {
        thumb.style.width = thumbLen + 'px';
        thumb.style.height = '';
        thumb.style.transform = `translateX(${pos}px)`;
      } else {
        thumb.style.height = thumbLen + 'px';
        thumb.style.width = '';
        thumb.style.transform = `translateY(${pos}px)`;
      }
    },

    show() {
      if (track.style.display === 'none') return;
      track.classList.add('visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        if (!dragging && !hovering) track.classList.remove('visible');
      }, 1000);
    },

    destroy() {
      clearTimeout(hideTimer);
      if (st.ro) { try { st.ro.disconnect(); } catch (e) {} }
      track.remove();
      CSB.delete(el);
    }
  };

  el.addEventListener('mouseenter', () => { hovering = true; st.show(); });
  el.addEventListener('mouseleave', () => {
    hovering = false;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { if (!dragging) track.classList.remove('visible'); }, 420);
  });
  el.addEventListener('scroll', () => { scheduleScrollbars(); st.show(); }, { passive: true });

  if (el.tagName === 'TEXTAREA') {
    el.addEventListener('input', scheduleScrollbars, { passive: true });
  }

  /* ---- Drag the thumb ---- */
  thumb.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    ev.stopPropagation();
    dragging = true;
    track.classList.add('dragging');
    try { thumb.setPointerCapture(ev.pointerId); } catch (e) {}

    const startPos = horizontal ? ev.clientX : ev.clientY;
    const startScroll = horizontal ? el.scrollLeft : el.scrollTop;
    const viewport = horizontal ? el.clientWidth : el.clientHeight;
    const content = horizontal ? el.scrollWidth : el.scrollHeight;
    const trackLen = horizontal ? track.offsetWidth : track.offsetHeight;
    const thumbLen = horizontal ? thumb.offsetWidth : thumb.offsetHeight;
    const maxTravel = trackLen - thumbLen;
    const scrollMax = content - viewport;

    const onMove = e2 => {
      const delta = (horizontal ? e2.clientX : e2.clientY) - startPos;
      const ratio = maxTravel > 0 ? delta / maxTravel : 0;
      const target = Math.max(0, Math.min(scrollMax, startScroll + ratio * scrollMax));
      if (horizontal) el.scrollLeft = target; else el.scrollTop = target;
    };
    const onUp = () => {
      dragging = false;
      track.classList.remove('dragging');
      thumb.removeEventListener('pointermove', onMove);
      thumb.removeEventListener('pointerup', onUp);
      thumb.removeEventListener('pointercancel', onUp);
      st.show();
    };
    thumb.addEventListener('pointermove', onMove);
    thumb.addEventListener('pointerup', onUp);
    thumb.addEventListener('pointercancel', onUp);
  });

  /* ---- Click the track to jump ---- */
  track.addEventListener('pointerdown', ev => {
    if (ev.target === thumb) return;
    ev.preventDefault();
    const rect = track.getBoundingClientRect();
    const viewport = horizontal ? el.clientWidth : el.clientHeight;
    const content = horizontal ? el.scrollWidth : el.scrollHeight;
    const clickPos = horizontal ? ev.clientX - rect.left : ev.clientY - rect.top;
    const trackLen = horizontal ? rect.width : rect.height;
    const target = (clickPos / trackLen) * content - viewport / 2;
    const clamped = Math.max(0, Math.min(content - viewport, target));
    if (horizontal) el.scrollTo({ left: clamped, behavior: 'smooth' });
    else el.scrollTo({ top: clamped, behavior: 'smooth' });
    st.show();
  });

  /* ---- Keep geometry fresh on size changes ---- */
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => scheduleScrollbars());
    ro.observe(el);
    st.ro = ro;
  }

  CSB.set(el, st);
  st.update();
  return st;
}

window.addEventListener('resize', scheduleScrollbars);
window.addEventListener('scroll', scheduleScrollbars, true);

/* Auto-detect DOM changes so newly-created scrollers get a bar */
if (window.MutationObserver) {
  const mo = new MutationObserver(muts => {
    for (const m of muts) {
      if (m.type !== 'childList') continue;
      const nodes = [...m.addedNodes, ...m.removedNodes];
      if (!nodes.length) continue;
      if (nodes.every(n => n.nodeType === 1 && n.classList && n.classList.contains('csb'))) continue;
      scheduleRefresh();
      return;
    }
  });
  mo.observe(document.body, { childList: true, subtree: true });
}

/* ============================================================
   IndexedDB layer
   ------------------------------------------------------------
   Database: "listing-app"  (name kept for backwards compat)
   Stores:
     - groups   (keyPath: id)     one record per group (nested entries/tags)
     - trash    (keyPath: id)     one record per trashed item
     - settings (keyPath: key)    app preferences
   ============================================================ */
const DB_NAME = 'listing-app';
const DB_VERSION = 1;
const STORE_GROUPS = 'groups';
const STORE_TRASH = 'trash';
const STORE_SETTINGS = 'settings';

const DB = {
  _db: null,
  _openPromise: null,
  _supported: typeof indexedDB !== 'undefined',

  open() {
    if (this._db) return Promise.resolve(this._db);
    if (this._openPromise) return this._openPromise;
    if (!this._supported) return Promise.reject(new Error('IndexedDB is not supported'));

    this._openPromise = new Promise((resolve, reject) => {
      let req;
      try {
        req = indexedDB.open(DB_NAME, DB_VERSION);
      } catch (err) {
        reject(err);
        return;
      }

      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_GROUPS)) {
          db.createObjectStore(STORE_GROUPS, { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains(STORE_TRASH)) {
          db.createObjectStore(STORE_TRASH, { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
          db.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
        }
      };

      req.onsuccess = () => {
        this._db = req.result;
        this._db.onversionchange = () => {
          try { this._db.close(); } catch (e) {}
          this._db = null;
          this._openPromise = null;
        };
        resolve(this._db);
      };

      req.onerror = () => {
        this._openPromise = null;
        reject(req.error || new Error('Failed to open IndexedDB'));
      };

      req.onblocked = () => {
        console.warn('[DB] Open blocked — another tab may be holding an older version.');
      };
    });

    return this._openPromise;
  },

  _readAll(store) {
    return this.open().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    }));
  },

  getAllGroups() { return this._readAll(STORE_GROUPS); },
  getAllTrash() { return this._readAll(STORE_TRASH); },

  getSetting(key) {
    return this.open().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_SETTINGS, 'readonly');
      const req = tx.objectStore(STORE_SETTINGS).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
      req.onerror = () => reject(req.error);
    }));
  },

  putSetting(key, value) {
    return this.open().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_SETTINGS, 'readwrite');
      tx.objectStore(STORE_SETTINGS).put({ key, value });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  },

  /* Bulk write used by flush() */
  bulkWrite({ putGroups, deleteGroups, putTrash, deleteTrash, clearTrash, putSettings }) {
    return this.open().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_GROUPS, STORE_TRASH, STORE_SETTINGS], 'readwrite');
      const gs = tx.objectStore(STORE_GROUPS);
      const ts = tx.objectStore(STORE_TRASH);
      const ss = tx.objectStore(STORE_SETTINGS);

      if (clearTrash) ts.clear();
      if (putGroups) for (const g of putGroups) gs.put(g);
      if (deleteGroups) for (const id of deleteGroups) gs.delete(id);
      if (putTrash) for (const t of putTrash) ts.put(t);
      if (deleteTrash) for (const id of deleteTrash) ts.delete(id);
      if (putSettings) for (const s of putSettings) ss.put(s);

      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('Bulk write failed'));
      tx.onabort = () => reject(tx.error || new Error('Bulk write aborted'));
    }));
  },

  /* Full rewrite — used for "sync everything" scenarios */
  fullSync(groups, trash, settings) {
    return this.open().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_GROUPS, STORE_TRASH, STORE_SETTINGS], 'readwrite');
      const gs = tx.objectStore(STORE_GROUPS);
      const ts = tx.objectStore(STORE_TRASH);
      const ss = tx.objectStore(STORE_SETTINGS);

      gs.clear();
      ts.clear();
      for (const g of groups) gs.put(g);
      for (const t of trash) ts.put(t);
      ss.put({ key: 'theme', value: settings.theme });

      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    }));
  },

  clearAll() {
    return this.open().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction([STORE_GROUPS, STORE_TRASH, STORE_SETTINGS], 'readwrite');
      tx.objectStore(STORE_GROUPS).clear();
      tx.objectStore(STORE_TRASH).clear();
      tx.objectStore(STORE_SETTINGS).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }
};

/* ============================================================
   Dirty tracking + flush queue
   ============================================================ */
const dirty = {
  groups: new Set(),
  trash: new Set(),
  deletedGroups: new Set(),
  deletedTrash: new Set(),
  trashCleared: false,
  settings: false,
  fullSync: false
};

let saveTimer = null;
let flushInProgress = false;
let flushPending = false;

function touchGroup(id) { if (id) dirty.groups.add(id); }
function touchTrash(id) { if (id) dirty.trash.add(id); }
function touchSettings() { dirty.settings = true; }
function markGroupDeleted(id) { if (id) { dirty.deletedGroups.add(id); dirty.groups.delete(id); } }
function markTrashDeleted(id) { if (id) { dirty.deletedTrash.add(id); dirty.trash.delete(id); } }
function markTrashCleared() { dirty.trashCleared = true; dirty.trash.clear(); dirty.deletedTrash.clear(); }
function markFullSync() { dirty.fullSync = true; }

function hasPendingChanges() {
  return dirty.groups.size > 0 || dirty.trash.size > 0 ||
         dirty.deletedGroups.size > 0 || dirty.deletedTrash.size > 0 ||
         dirty.trashCleared || dirty.settings || dirty.fullSync;
}

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 180);
}

async function flush() {
  if (!hasPendingChanges()) return;
  if (flushInProgress) { flushPending = true; return; }
  if (!DB._supported) {
    dirty.groups.clear(); dirty.trash.clear();
    dirty.deletedGroups.clear(); dirty.deletedTrash.clear();
    dirty.trashCleared = false; dirty.settings = false; dirty.fullSync = false;
    return;
  }

  flushInProgress = true;
  const snap = {
    groups: new Set(dirty.groups),
    trash: new Set(dirty.trash),
    deletedGroups: new Set(dirty.deletedGroups),
    deletedTrash: new Set(dirty.deletedTrash),
    trashCleared: dirty.trashCleared,
    settings: dirty.settings,
    fullSync: dirty.fullSync
  };
  dirty.groups.clear();
  dirty.trash.clear();
  dirty.deletedGroups.clear();
  dirty.deletedTrash.clear();
  dirty.trashCleared = false;
  dirty.settings = false;
  dirty.fullSync = false;

  try {
    if (snap.fullSync) {
      await DB.fullSync(State.groups, State.trash, State.settings);
    } else {
      const payload = {
        putGroups: [],
        deleteGroups: [...snap.deletedGroups],
        putTrash: [],
        deleteTrash: [...snap.deletedTrash],
        clearTrash: snap.trashCleared,
        putSettings: snap.settings ? [{ key: 'theme', value: State.settings.theme }] : null
      };
      for (const id of snap.groups) {
        const g = State.groups.find(x => x.id === id);
        if (g) payload.putGroups.push(g);
      }
      for (const id of snap.trash) {
        const t = State.trash.find(x => x.id === id);
        if (t) payload.putTrash.push(t);
      }
      await DB.bulkWrite(payload);
    }
  } catch (err) {
    console.error('[DB] Flush failed, will retry:', err);
    snap.groups.forEach(id => dirty.groups.add(id));
    snap.trash.forEach(id => dirty.trash.add(id));
    snap.deletedGroups.forEach(id => dirty.deletedGroups.add(id));
    snap.deletedTrash.forEach(id => dirty.deletedTrash.add(id));
    if (snap.trashCleared) dirty.trashCleared = true;
    if (snap.settings) dirty.settings = true;
    if (snap.fullSync) dirty.fullSync = true;
  } finally {
    flushInProgress = false;
    if (flushPending) {
      flushPending = false;
      flush();
    }
  }
}

/* Flush opportunistically when tab is hidden / unloaded */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flush();
});
window.addEventListener('pagehide', () => { flush(); });

/* ============================================================
   State
   ============================================================ */
const State = {
  groups: [],
  trash: [],
  settings: { theme: 'device' }
};

const ui = {};
let currentView = 'home';

function getUI(groupId) {
  if (!ui[groupId]) ui[groupId] = { filter: 'all', sort: 'newest' };
  return ui[groupId];
}
function getGroup(id) { return State.groups.find(g => g.id === id); }

/* ============================================================
   Theme
   ============================================================ */
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme() {
  const t = State.settings.theme;
  const resolved = t === 'device' ? (darkQuery.matches ? 'dark' : 'light') : t;
  document.documentElement.dataset.theme = resolved;
}
darkQuery.addEventListener('change', () => { if (State.settings.theme === 'device') applyTheme(); });

/* ============================================================
   Popovers
   ============================================================ */
let activePopover = null;

function closePopover() {
  if (!activePopover) return;
  activePopover.remove();
  activePopover = null;
  document.removeEventListener('mousedown', onDocMouseDown, true);
  scheduleScrollbars();
}
function onDocMouseDown(e) {
  if (!activePopover) return;
  if (activePopover.contains(e.target)) return;
  if (activePopover._anchor && activePopover._anchor.contains(e.target)) return;
  closePopover();
}

function openPopover(anchor, content) {
  if (activePopover && activePopover._anchor === anchor) { closePopover(); return null; }
  closePopover();

  const pop = h('div', { class: 'popover' }, content);
  pop.style.visibility = 'hidden';
  document.getElementById('popover-root').append(pop);

  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left;
  let top = r.bottom + 6;
  if (left + pw > window.innerWidth - 10) left = Math.max(10, window.innerWidth - pw - 10);
  if (left < 10) left = 10;
  if (top + ph > window.innerHeight - 10) top = Math.max(10, r.top - ph - 6);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.visibility = 'visible';
  pop._anchor = anchor;

  activePopover = pop;
  setTimeout(() => document.addEventListener('mousedown', onDocMouseDown, true), 0);
  scheduleRefresh();
  return pop;
}

/* ============================================================
   Modals
   ============================================================ */
let modalStack = [];

function openModal({ title, body, actions = [], wide = false, expandable = false, fullscreen = false }) {
  const backdrop = h('div', { class: 'modal-backdrop' });
  const modal = h('div', { class: 'modal' + (wide ? ' modal-wide' : '') });
  const closeBtn = h('button', { class: 'icon-btn', title: 'Close', type: 'button' }, iconEl('close'));
  const headKids = [h('h3', {}, title)];
  if (expandable) {
    const fsBtn = h('button', { class: 'icon-btn', type: 'button' });
    const sync = () => {
      const on = modal.classList.contains('fullscreen');
      fsBtn.title = on ? 'Exit full screen' : 'Full screen';
      fsBtn.replaceChildren(iconEl(on ? 'collapse' : 'expand', 18));
      scheduleScrollbars();
    };
    fsBtn.addEventListener('click', () => {
      modal.classList.toggle('fullscreen');
      backdrop.classList.toggle('fullscreen');
      sync();
    });
    if (fullscreen) { modal.classList.add('fullscreen'); backdrop.classList.add('fullscreen'); }
    sync();
    headKids.push(fsBtn);
  }
  headKids.push(closeBtn);
  const head = h('div', { class: 'modal-head' }, headKids);
  const bodyEl = h('div', { class: 'modal-body', 'data-csb': 'y' }, body);
  const foot = h('div', { class: 'modal-foot' }, actions);
  modal.append(head, bodyEl, foot);
  backdrop.append(modal);
  document.getElementById('modal-root').append(backdrop);
  requestAnimationFrame(() => backdrop.classList.add('show'));

  const instance = {
    bodyEl,
    close() {
      bodyEl.querySelectorAll('.voice-recorder').forEach(el => el._cleanup && el._cleanup());
      backdrop.classList.remove('show');
      setTimeout(() => { backdrop.remove(); scheduleScrollbars(); }, 160);
      modalStack = modalStack.filter(m => m !== instance);
    }
  };

  closeBtn.addEventListener('click', instance.close);
  backdrop.addEventListener('mousedown', e => { if (e.target === backdrop) instance.close(); });
  modalStack.push(instance);

  scheduleRefresh();
  setTimeout(scheduleScrollbars, 180);

  return instance;
}

function confirmDialog({ title, message, confirmText = 'Confirm', danger = false, onConfirm }) {
  const body = h('div', {}, h('p', { style: { margin: '0', lineHeight: '1.65', fontSize: '13.5px', color: 'var(--muted)' } }, message));
  const cancel = h('button', { class: 'btn', type: 'button' }, 'Cancel');
  const ok = h('button', { class: 'btn ' + (danger ? 'danger-solid' : 'primary'), type: 'button' }, confirmText);
  const m = openModal({ title, body, actions: [cancel, ok] });
  cancel.addEventListener('click', m.close);
  ok.addEventListener('click', () => { m.close(); onConfirm(); });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; }
    if (document.querySelector('.overlay')) { closeOverlay(); return; }
    closePopover();
  }
});

/* ============================================================
   RENDER — APP SHELL
   ============================================================ */
function renderApp() {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  const view = document.getElementById('view-' + currentView);
  view.classList.remove('hidden');
  view.replaceChildren();

  if (currentView === 'home') renderHome(view);
  else if (currentView === 'trash') renderTrash(view);
  else renderSettings(view);

  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === currentView);
  });

  const ngBtn = document.getElementById('new-group-btn');
  if (ngBtn) ngBtn.classList.toggle('hidden', currentView !== 'home');

  scheduleRefresh();
}

/* ============================================================
   HOME
   ============================================================ */
function renderHome(container) {
  if (State.groups.length === 0) {
    container.append(
      h('div', { class: 'empty-state' },
        h('div', { class: 'empty-icon' }, iconEl('list', 28)),
        h('h2', {}, 'Nothing here yet'),
        h('p', {}, 'Create a group to get started. Each group holds its own entries, and you decide what every entry can contain — images, voice notes, tags, links, locations, a done tick, a countdown, and more.'),
        h('button', { class: 'btn primary', type: 'button', onclick: () => openGroupModal(null) },
          iconEl('plus', 15), 'New Group')
      )
    );
    return;
  }

  const strip = h('div', { class: 'groups-strip', 'data-csb': 'x' });
  State.groups.forEach(g => strip.append(renderGroupColumn(g)));
  container.append(strip);
}

/* ------------------------------------------------------------
   Group column
   ------------------------------------------------------------ */
function renderGroupColumn(group) {
  const col = h('div', { class: 'group-col', 'data-group': group.id });

  const head = h('div', { class: 'group-head' });

  head.append(
    h('div', { class: 'group-head-top' },
      h('h2', { class: 'group-name' }, group.name)
    ),
    group.description
      ? h('p', { class: 'group-desc' }, group.description)
      : h('p', { class: 'group-desc placeholder' }, 'No description')
  );

  const u = getUI(group.id);
  const activeTag = group.tags.find(t => t.id === u.filter);
  const filterBtn = h('button', { class: 'tool-btn' + (u.filter !== 'all' ? ' active' : ''), type: 'button', title: 'Filter by tag' },
    iconEl('filter', 13),
    h('span', { class: 'lbl' }, u.filter === 'all' ? 'All' : (activeTag ? activeTag.name : 'All')),
    iconEl('chevron', 12)
  );
  filterBtn.addEventListener('click', () => openFilterPopover(filterBtn, group));

  const SORT_LABELS = {
    'newest': 'Newest first',
    'oldest': 'Oldest first',
    'name-asc': 'Name (A–Z)',
    'name-desc': 'Name (Z–A)',
    'updated': 'Recently updated'
  };
  const sortBtn = h('button', { class: 'tool-btn', type: 'button', title: 'Sort entries' },
    iconEl('sort', 13),
    h('span', { class: 'lbl' }, SORT_LABELS[u.sort]),
    iconEl('chevron', 12)
  );
  sortBtn.addEventListener('click', () => openSortPopover(sortBtn, group));

  const editBtn = h('button', { class: 'icon-btn', type: 'button', title: 'Edit group' }, iconEl('edit', 15));
  editBtn.addEventListener('click', () => openGroupModal(group));

  const delBtn = h('button', { class: 'icon-btn danger', type: 'button', title: 'Delete group' }, iconEl('trash', 15));
  delBtn.addEventListener('click', () => confirmDeleteGroup(group));

  const infoBtn = h('button', { class: 'icon-btn', type: 'button', title: 'Group info' }, iconEl('info', 15));
  infoBtn.addEventListener('click', () => openGroupInfo(group));

  head.append(
    h('div', { class: 'group-tools' },
      filterBtn,
      sortBtn,
      h('div', { class: 'spacer' }),
      editBtn, delBtn, infoBtn
    )
  );

  const addEntryBtn = h('button', { class: 'btn primary block', type: 'button' },
    iconEl('plus', 15), 'Add Entry');
  addEntryBtn.addEventListener('click', () => openEntryModal(group, null));
  head.append(addEntryBtn);

  col.append(head, renderGroupBody(group));
  return col;
}

function renderGroupBody(group) {
  const body = h('div', { class: 'group-body', 'data-group-body': group.id, 'data-csb': 'y' });
  const u = getUI(group.id);

  let entries = group.entries.slice();
  if (u.filter !== 'all') entries = entries.filter(e => (e.tags || []).includes(u.filter));
  entries = sortEntries(entries, u.sort);

  if (entries.length === 0) {
    body.append(h('div', { class: 'group-empty' },
      group.entries.length
        ? 'No entries match this filter.'
        : 'No entries yet. Press “Add Entry” to create one.'
    ));
  } else {
    entries.forEach(e => body.append(renderEntry(group, e)));
  }
  return body;
}

function sortEntries(list, sort) {
  const arr = list.slice();
  switch (sort) {
    case 'newest': arr.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); break;
    case 'oldest': arr.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)); break;
    case 'name-asc': arr.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' })); break;
    case 'name-desc': arr.sort((a, b) => b.name.localeCompare(a.name, undefined, { sensitivity: 'base' })); break;
    case 'updated': arr.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)); break;
  }
  return arr;
}

function refreshGroupBody(groupId) {
  const group = getGroup(groupId);
  if (!group) return;
  const old = document.querySelector(`[data-group-body="${groupId}"]`);
  if (old) old.replaceWith(renderGroupBody(group));
  else renderApp();
  scheduleRefresh();
}

/* ============================================================
   FILTER / SORT POPOVERS
   ============================================================ */
function openFilterPopover(anchor, group) {
  const u = getUI(group.id);
  const wrap = h('div', {});
  wrap.append(h('div', { class: 'popover-label' }, 'Filter by tag'));

  const makeItem = (label, value) => {
    const btn = h('button', { class: 'popover-item' + (u.filter === value ? ' active' : ''), type: 'button' },
      h('span', {}, label),
      u.filter === value ? h('span', { class: 'check-mark' }, iconEl('check', 14)) : null
    );
    btn.addEventListener('click', () => {
      u.filter = value;
      closePopover();
      renderApp();
    });
    return btn;
  };

  wrap.append(makeItem('All', 'all'));
  group.tags.forEach(t => wrap.append(makeItem(t.name, t.id)));
  if (!group.tags.length) {
    wrap.append(h('div', { class: 'muted small pad' }, 'No tags in this group yet.'));
  }
  openPopover(anchor, wrap);
}

function openSortPopover(anchor, group) {
  const u = getUI(group.id);
  const options = [
    ['newest', 'Newest first'],
    ['oldest', 'Oldest first'],
    ['name-asc', 'Name (A–Z)'],
    ['name-desc', 'Name (Z–A)'],
    ['updated', 'Recently updated']
  ];
  const wrap = h('div', {});
  wrap.append(h('div', { class: 'popover-label' }, 'Sort by'));
  options.forEach(([value, label]) => {
    const btn = h('button', { class: 'popover-item' + (u.sort === value ? ' active' : ''), type: 'button' },
      h('span', {}, label),
      u.sort === value ? h('span', { class: 'check-mark' }, iconEl('check', 14)) : null
    );
    btn.addEventListener('click', () => {
      u.sort = value;
      closePopover();
      renderApp();
    });
    wrap.append(btn);
  });
  openPopover(anchor, wrap);
}

/* ============================================================
   ENTRY RENDERING
   ============================================================ */
function renderEntry(group, entry) {
  const hasImages = group.fields.images && entry.images && entry.images.length > 0;
  const node = h('div', {
    class: 'entry ' + (hasImages ? 'entry-card' : 'entry-row') + (entry.done ? ' is-done' : ''),
    'data-entry': entry.id
  });

  node.addEventListener('click', (ev) => {
    if (ev.target.closest('.entry-more') || ev.target.closest('.done-check')) return;
    openEntryOverlay(group, entry);
  });

  let doneBtn = null;
  if (group.fields.done) {
    doneBtn = h('button', { class: 'done-check' + (entry.done ? ' checked' : ''), type: 'button', title: 'Toggle done' },
      entry.done ? iconEl('check', 12) : null
    );
    doneBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      entry.done = !entry.done;
      entry.updatedAt = new Date().toISOString();
      doneBtn.classList.toggle('checked', entry.done);
      doneBtn.replaceChildren(entry.done ? iconEl('check', 12) : document.createTextNode(''));
      node.classList.toggle('is-done', entry.done);
      touchGroup(group.id);
      save();
    });
  }

  const moreBtn = h('button', { class: 'entry-more', type: 'button', title: 'More' }, iconEl('more', 15));
  moreBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    openEntryMenu(moreBtn, group, entry);
  });

  const top = h('div', { class: 'entry-top' }, doneBtn, h('div', { class: 'entry-title' }, entry.name), moreBtn);

  const main = h('div', { class: 'entry-main' }, top);

  if (!hasImages && group.fields.description && entry.description) {
    main.append(h('div', { class: 'entry-desc' }, entry.description));
  }

  const meta = h('div', { class: 'entry-meta' });
  if (group.fields.tags) {
    (entry.tags || []).forEach(tid => {
      const tag = group.tags.find(t => t.id === tid);
      if (tag) meta.append(h('span', { class: 'chip sm' }, tag.name));
    });
  }
  if (group.fields.voice && entry.voice) {
    meta.append(h('span', { class: 'chip sm voice' }, iconEl('mic', 11), 'Voice'));
  }
  if (group.fields.images && entry.images && entry.images.length > 1) {
    meta.append(h('span', { class: 'chip sm plain' }, iconEl('image', 11), entry.images.length));
  }
  if (group.fields.url && entry.url) {
    meta.append(h('span', { class: 'chip sm plain' }, iconEl('link', 11), truncate(entry.url.replace(/^https?:\/\//i, ''), 22)));
  }
  if (group.fields.location && entry.location) {
    meta.append(h('span', { class: 'chip sm plain' }, iconEl('pin', 11), truncate(entry.location, 22)));
  }
  if (meta.children.length) main.append(meta);

  if (group.fields.countdown && entry.countdown) {
    main.append(countdownNode(entry));
  }

  if (hasImages) {
    node.append(h('div', { class: 'entry-thumb' }, h('img', { src: entry.images[0], alt: '' })));
  }
  node.append(main);
  return node;
}

function countdownNode(entry) {
  const wrap = h('div', { class: 'countdown' });
  const fill = h('div', { class: 'cd-fill' });
  const bar = h('div', { class: 'cd-bar' }, fill);
  const txt = h('div', { class: 'cd-text' });
  wrap.append(bar, txt);

  const update = () => {
    const due = new Date(entry.countdown).getTime();
    const created = new Date(entry.createdAt).getTime();
    const now = Date.now();
    const total = due - created;
    const pct = total > 0 ? Math.min(100, Math.max(0, ((now - created) / total) * 100)) : 100;
    fill.style.width = pct + '%';
    const overdue = now > due;
    wrap.classList.toggle('overdue', overdue);
    txt.textContent = countdownText(entry.countdown) + ' · until ' + fmtDateTime(entry.countdown);
  };
  update();
  wrap._update = update;
  return wrap;
}

setInterval(() => {
  document.querySelectorAll('.countdown').forEach(el => { if (el._update) el._update(); });
}, 1000);

/* ------------------------------------------------------------
   Entry three-dot menu
   ------------------------------------------------------------ */
function moveEntryToTrash(group, entry) {
  group.entries = group.entries.filter(e => e.id !== entry.id);
  const trashItem = {
    id: uid(),
    type: 'entry',
    deletedAt: new Date().toISOString(),
    groupId: group.id,
    groupName: group.name,
    data: entry
  };
  State.trash.push(trashItem);
  touchGroup(group.id);
  touchTrash(trashItem.id);
  save();
  renderApp();
  toast('Entry moved to Trash');
}

function openEntryMenu(anchor, group, entry) {
  const wrap = h('div', {});
  const edit = h('button', { class: 'popover-item', type: 'button' }, iconEl('edit', 14), 'Edit entry');
  edit.addEventListener('click', () => {
    closePopover();
    openEntryModal(group, entry);
  });
  const del = h('button', { class: 'popover-item danger', type: 'button' }, iconEl('trash', 14), 'Delete entry');
  del.addEventListener('click', () => {
    closePopover();
    confirmDialog({
      title: 'Delete entry?',
      message: `“${entry.name}” will be moved to the Trash. You can restore it within 30 days.`,
      confirmText: 'Move to Trash',
      danger: true,
      onConfirm: () => moveEntryToTrash(group, entry)
    });
  });
  wrap.append(edit, del);
  openPopover(anchor, wrap);
}

/* ============================================================
   GROUP MODAL (create / edit)
   ============================================================ */
const FIELD_DEFS = [
  ['name', 'Name', 'Required — every entry needs one'],
  ['description', 'Description', 'A longer note for the entry'],
  ['images', 'Images', 'Attach photos by picking or dropping'],
  ['voice', 'Voice Recorder', 'Record audio notes'],
  ['tags', 'Tags', 'Reusable labels you can filter by'],
  ['url', 'URL', 'Attach a link to any entry'],
  ['location', 'Location', 'Attach an address or a place'],
  ['done', 'Done tracking', 'Tick entries on and off'],
  ['countdown', 'Countdown', 'A due date with a live countdown']
];

const DEFAULT_FIELDS = {
  name: true, description: false, images: false, voice: false,
  tags: false, url: false, location: false, done: false, countdown: false
};

function openGroupModal(group) {
  const isEdit = !!group;
  const draftFields = isEdit
    ? Object.assign({}, group.fields)
    : Object.assign({}, DEFAULT_FIELDS);

  const nameInput = h('input', {
    class: 'input', type: 'text', placeholder: 'e.g. Weekend Projects',
    value: isEdit ? group.name : '', maxlength: 80
  });
  const descInput = h('textarea', {
    class: 'input', placeholder: 'What is this group about? (optional)', rows: 4, maxlength: 400
  });
  descInput.value = isEdit ? (group.description || '') : '';

  const nameError = h('div', { class: 'field-error hidden' }, 'Please enter a name.');
  nameInput.addEventListener('input', () => {
    nameInput.classList.remove('error');
    nameError.classList.add('hidden');
  });

  const toggleList = h('div', { class: 'toggle-list' });
  FIELD_DEFS.forEach(([key, label, hint]) => {
    const input = h('input', { type: 'checkbox' });
    input.checked = !!draftFields[key];
    if (key === 'name' || isEdit) input.disabled = true;
    input.addEventListener('change', () => { draftFields[key] = input.checked; });

    const sw = h('label', { class: 'switch' }, input, h('span', { class: 'switch-track' }, h('span', { class: 'switch-thumb' })));

    toggleList.append(
      h('div', { class: 'toggle-row' },
        h('div', { class: 'toggle-text' },
          h('div', { class: 'toggle-name' }, label, key === 'name' ? h('span', { class: 'muted small' }, ' · required') : null),
          h('div', { class: 'toggle-hint' }, hint)
        ),
        sw
      )
    );
  });

  const leftCol = h('div', {},
    h('div', { class: 'field-label', style: { marginBottom: '8px' } }, isEdit ? 'ENTRY FIELDS (locked)' : 'WHAT ENTRIES CAN CONTAIN'),
    toggleList,
    isEdit ? h('p', { class: 'muted small', style: { marginTop: '12px', lineHeight: '1.55' } },
      'Fields can’t be changed after a group is created — turning them off would delete existing entry data.') : null
  );

  const rightCol = h('div', {},
    h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'GROUP NAME'),
      nameInput,
      nameError
    ),
    h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'DESCRIPTION'),
      descInput
    )
  );

  const body = h('div', { class: 'modal-grid' }, leftCol, rightCol);

  const cancelBtn = h('button', { class: 'btn', type: 'button' }, 'Cancel');
  const saveBtn = h('button', { class: 'btn primary', type: 'button' }, isEdit ? 'Save Changes' : 'Create Group');

  const modal = openModal({
    title: isEdit ? 'Edit Group' : 'New Group',
    body,
    actions: [cancelBtn, saveBtn],
    wide: true
  });

  cancelBtn.addEventListener('click', modal.close);

  saveBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.classList.add('error');
      nameError.classList.remove('hidden');
      nameInput.focus();
      return;
    }
    const description = descInput.value.trim();

    if (isEdit) {
      group.name = name;
      group.description = description;
      group.updatedAt = new Date().toISOString();
      touchGroup(group.id);
      toast('Group updated');
    } else {
      const newGroup = {
        id: uid(),
        name,
        description,
        fields: Object.assign({}, DEFAULT_FIELDS, draftFields, { name: true }),
        tags: [],
        entries: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      State.groups.push(newGroup);
      touchGroup(newGroup.id);
      toast('Group created');
    }
    save();
    modal.close();
    renderApp();
  });

  setTimeout(() => nameInput.focus(), 60);
}

/* ============================================================
   ENTRY MODAL (create / edit)
   ============================================================ */
let pendingEditFullscreen = false;
function openEntryModal(group, entry) {
  const isEdit = !!entry;
  const draft = entry
    ? JSON.parse(JSON.stringify(entry))
    : {
        id: uid(),
        name: '',
        description: '',
        images: [],
        voice: null,
        tags: [],
        url: '',
        location: '',
        done: false,
        countdown: null,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

  const wrap = h('div', {});

  /* --- Name --- */
  const nameInput = h('input', { class: 'input', type: 'text', placeholder: 'Entry name', value: draft.name, maxlength: 120 });
  const nameError = h('div', { class: 'field-error hidden' }, 'Name is required.');
  nameInput.addEventListener('input', () => {
    nameInput.classList.remove('error');
    nameError.classList.add('hidden');
  });
  wrap.append(h('div', { class: 'field' },
    h('div', { class: 'field-label' }, 'NAME *'),
    nameInput, nameError
  ));

  /* --- Description --- */
  if (group.fields.description) {
    const ta = h('textarea', { class: 'input', placeholder: 'Add a description…', rows: 3, maxlength: 1000 });
    ta.value = draft.description || '';
    ta.addEventListener('input', () => { draft.description = ta.value; });
    wrap.append(h('div', { class: 'field' }, h('div', { class: 'field-label' }, 'DESCRIPTION'), ta));
  }

  /* --- URL --- */
  if (group.fields.url) {
    const urlInput = h('input', { class: 'input', type: 'url', placeholder: 'https://example.com', value: draft.url || '', maxlength: 2048 });
    urlInput.addEventListener('input', () => { draft.url = urlInput.value.trim(); });
    wrap.append(h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'URL'),
      urlInput
    ));
  }

  /* --- Location --- */
  if (group.fields.location) {
    const locInput = h('input', { class: 'input', type: 'text', placeholder: 'Address, place or coordinates', value: draft.location || '', maxlength: 240 });
    locInput.addEventListener('input', () => { draft.location = locInput.value.trim(); });

    const geoBtn = h('button', { class: 'btn sm', type: 'button', title: 'Use my current coordinates' },
      iconEl('pin', 13), 'Current');
    geoBtn.addEventListener('click', () => {
      if (!navigator.geolocation) { toast('Geolocation is not supported', 'error'); return; }
      geoBtn.disabled = true;
      navigator.geolocation.getCurrentPosition(
        pos => {
          geoBtn.disabled = false;
          const { latitude, longitude } = pos.coords;
          locInput.value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
          draft.location = locInput.value;
          toast('Location captured');
        },
        () => {
          geoBtn.disabled = false;
          toast('Could not get your location', 'error');
        },
        { timeout: 10000 }
      );
    });

    wrap.append(h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'LOCATION'),
      h('div', { class: 'field-row' }, locInput, geoBtn)
    ));
  }

  /* --- Images --- */
  if (group.fields.images) {
    const fileInput = h('input', { type: 'file', accept: 'image/*', multiple: true, style: { display: 'none' } });
    const grid = h('div', { class: 'img-grid' });

    const renderPreviews = () => {
      grid.replaceChildren();
      draft.images.forEach((src, i) => {
        const x = h('button', { class: 'x', type: 'button', title: 'Remove' }, '×');
        x.addEventListener('click', () => {
          draft.images.splice(i, 1);
          renderPreviews();
        });
        grid.append(h('div', { class: 'img-thumb' }, h('img', { src, alt: '' }), x));
      });
    };
    renderPreviews();

    const dz = h('div', { class: 'dropzone' },
      iconEl('image', 22),
      h('span', {}, 'Drop images here, or click to browse')
    );
    dz.addEventListener('click', () => fileInput.click());
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drag');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
      handleFiles(fileInput.files);
      fileInput.value = '';
    });

    function handleFiles(files) {
      Array.from(files).filter(f => f.type.startsWith('image/')).forEach(f => {
        const fr = new FileReader();
        fr.onload = () => { draft.images.push(fr.result); renderPreviews(); };
        fr.readAsDataURL(f);
      });
    }

    wrap.append(h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'IMAGES'),
      dz, fileInput, grid
    ));
  }

  /* --- Voice recorder --- */
  if (group.fields.voice) {
    const recorder = createVoiceRecorder(draft.voice, (dataUrl) => { draft.voice = dataUrl; });
    wrap.append(h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'VOICE RECORDING'),
      recorder
    ));
  }

  /* --- Tags --- */
  if (group.fields.tags) {
    const picker = createTagPicker(group, draft.tags || [], (ids) => { draft.tags = ids; });
    wrap.append(h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'TAGS'),
      picker
    ));
  }

  /* --- Done --- */
  if (group.fields.done) {
    const cb = h('input', { type: 'checkbox' });
    cb.checked = !!draft.done;
    cb.addEventListener('change', () => { draft.done = cb.checked; });
    const sw = h('label', { class: 'switch' }, cb, h('span', { class: 'switch-track' }, h('span', { class: 'switch-thumb' })));
    wrap.append(h('div', { class: 'field' },
      h('div', { class: 'toggle-row', style: { padding: '0' } },
        h('div', { class: 'toggle-text' },
          h('div', { class: 'toggle-name' }, 'Mark as done'),
          h('div', { class: 'toggle-hint' }, 'You can toggle this any time from the entry')
        ),
        sw
      )
    ));
  }

  /* --- Countdown --- */
  if (group.fields.countdown) {
    const dt = h('input', { class: 'input', type: 'datetime-local', value: toLocalInput(draft.countdown) });
    dt.addEventListener('change', () => {
      draft.countdown = dt.value ? new Date(dt.value).toISOString() : null;
    });
    wrap.append(h('div', { class: 'field' },
      h('div', { class: 'field-label' }, 'COUNTDOWN — END DATE & TIME'),
      dt
    ));
  }

  const cancelBtn = h('button', { class: 'btn', type: 'button' }, 'Cancel');
  const saveBtn = h('button', { class: 'btn primary', type: 'button' }, isEdit ? 'Save Changes' : 'Save Entry');

  const modal = openModal({
    title: isEdit ? 'Edit Entry' : 'New Entry',
    body: wrap,
    actions: [cancelBtn, saveBtn],
    expandable: true,
    fullscreen: pendingEditFullscreen
  });
  pendingEditFullscreen = false;

  cancelBtn.addEventListener('click', modal.close);

  saveBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.classList.add('error');
      nameError.classList.remove('hidden');
      nameInput.focus();
      return;
    }
    draft.name = name;
    draft.updatedAt = new Date().toISOString();

    if (isEdit) {
      Object.assign(entry, draft);
    } else {
      group.entries.push(draft);
    }
    touchGroup(group.id);
    save();
    modal.close();
    refreshGroupBody(group.id);
    toast(isEdit ? 'Entry updated' : 'Entry added');
  });

  setTimeout(() => nameInput.focus(), 60);
}

/* ============================================================
   VOICE RECORDER COMPONENT
   ============================================================ */
function createVoiceRecorder(initial, onChange) {
  let dataUrl = initial || null;
  let mode = dataUrl ? 'recorded' : 'idle';
  let paused = false;
  let elapsed = 0;
  let startedAt = 0;
  let timerId = null;
  let mediaRecorder = null;
  let stream = null;
  let chunks = [];

  const root = h('div', { class: 'voice-recorder' });

  const stopStream = () => {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  };
  const clearTimer = () => { if (timerId) { clearInterval(timerId); timerId = null; } };

  function tick() {
    const total = elapsed + (paused ? 0 : Date.now() - startedAt);
    const s = Math.floor(total / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    const el = root.querySelector('.rec-time');
    if (el) el.textContent = `${mm}:${ss}`;
  }

  async function start() {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      toast('Recording is not supported in this browser', 'error');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      toast('Microphone access denied', 'error');
      return;
    }
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      clearTimer();
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const fr = new FileReader();
      fr.onload = () => {
        dataUrl = fr.result;
        mode = 'recorded';
        paused = false;
        elapsed = 0;
        onChange(dataUrl);
        render();
      };
      fr.readAsDataURL(blob);
      stopStream();
      mediaRecorder = null;
    };
    mediaRecorder.start();
    mode = 'recording';
    paused = false;
    elapsed = 0;
    startedAt = Date.now();
    clearTimer();
    timerId = setInterval(tick, 200);
    render();
  }

  function pauseResume() {
    if (!mediaRecorder) return;
    if (paused) {
      mediaRecorder.resume();
      paused = false;
      startedAt = Date.now();
    } else {
      mediaRecorder.pause();
      elapsed += Date.now() - startedAt;
      paused = true;
    }
    render();
  }

  function finish() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    clearTimer();
  }

  function cancel() {
    if (mediaRecorder) {
      mediaRecorder.onstop = null;
      try { if (mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } catch (e) {}
    }
    stopStream();
    clearTimer();
    mediaRecorder = null;
    chunks = [];
    elapsed = 0;
    paused = false;
    mode = dataUrl ? 'recorded' : 'idle';
    render();
  }

  function removeRecording() {
    dataUrl = null;
    onChange(null);
    mode = 'idle';
    render();
  }

  function redo() {
    dataUrl = null;
    onChange(null);
    start();
  }

  function render() {
    root.replaceChildren();

    if (mode === 'idle') {
      const btn = h('button', { class: 'btn primary sm', type: 'button' }, iconEl('mic', 14), 'Record voice note');
      btn.addEventListener('click', start);
      root.append(h('div', { class: 'rec-row' }, btn,
        h('span', { class: 'muted small' }, 'Microphone access will be requested.')));
      return;
    }

    if (mode === 'recording') {
      const time = h('div', { class: 'rec-time' }, '00:00');
      const pauseBtn = h('button', { class: 'btn sm', type: 'button' },
        paused ? iconEl('play', 13) : iconEl('pause', 13), paused ? 'Resume' : 'Pause');
      pauseBtn.addEventListener('click', pauseResume);
      const doneBtn = h('button', { class: 'btn sm primary', type: 'button' }, 'Done');
      doneBtn.addEventListener('click', finish);
      const cancelBtn = h('button', { class: 'btn sm', type: 'button' }, 'Cancel');
      cancelBtn.addEventListener('click', cancel);

      root.append(
        h('div', { class: 'rec-row' }, h('span', { class: 'rec-dot' }), time,
          h('span', { class: 'muted small' }, paused ? 'Paused' : 'Recording…')),
        h('div', { class: 'rec-row' }, pauseBtn, doneBtn, cancelBtn)
      );
      return;
    }

    const audio = h('audio', { controls: true, src: dataUrl });
    const redoBtn = h('button', { class: 'btn sm', type: 'button' }, iconEl('refresh', 13), 'Redo');
    redoBtn.addEventListener('click', redo);
    const delBtn = h('button', { class: 'btn sm danger', type: 'button' }, iconEl('trash', 13), 'Delete');
    delBtn.addEventListener('click', removeRecording);

    root.append(
      h('div', { class: 'rec-row' }, h('span', { class: 'chip sm voice' }, iconEl('mic', 11), 'Voice note saved')),
      audio,
      h('div', { class: 'rec-row' }, redoBtn, delBtn)
    );
  }

  root._cleanup = () => {
    if (mediaRecorder) {
      mediaRecorder.onstop = null;
      try { if (mediaRecorder.state !== 'inactive') mediaRecorder.stop(); } catch (e) {}
    }
    stopStream();
    clearTimer();
  };

  render();
  return root;
}

/* ============================================================
   TAG PICKER COMPONENT
   ============================================================ */
function createTagPicker(group, selectedIds, onChange) {
  let selected = (selectedIds || []).slice();

  const wrap = h('div', { class: 'tag-picker' });
  const chips = h('div', { class: 'tag-chips' });
  const openBtn = h('button', { class: 'btn sm', type: 'button' }, '+ Tags');

  function renderChips() {
    chips.replaceChildren();
    const valid = selected.filter(id => group.tags.some(t => t.id === id));
    if (valid.length !== selected.length) {
      selected = valid;
      onChange(selected);
    }
    if (!valid.length) {
      chips.append(h('span', { class: 'muted small' }, 'No tags selected'));
    } else {
      valid.forEach(id => {
        const tag = group.tags.find(t => t.id === id);
        const x = h('button', { class: 'chip-x', type: 'button' }, '×');
        x.addEventListener('click', () => {
          selected = selected.filter(s => s !== id);
          onChange(selected);
          renderChips();
          if (activePopover) drawPopover();
        });
        chips.append(h('span', { class: 'chip' }, tag.name, x));
      });
    }
  }

  function drawPopover() {
    if (!activePopover) return;
    const content = activePopover.querySelector('.tag-pop');
    if (!content) return;
    content.replaceChildren();

    const list = h('div', { class: 'tag-list', 'data-csb': 'y' });
    if (!group.tags.length) {
      list.append(h('div', { class: 'muted small pad' }, 'No tags in this group yet.'));
    }
    group.tags.forEach(tag => {
      const cb = h('input', { type: 'checkbox' });
      cb.checked = selected.includes(tag.id);
      cb.addEventListener('change', () => {
        if (cb.checked) {
          if (!selected.includes(tag.id)) selected.push(tag.id);
        } else {
          selected = selected.filter(s => s !== tag.id);
        }
        onChange(selected);
        renderChips();
      });

      const renameBtn = h('button', { class: 'mini-btn', type: 'button', title: 'Rename tag' }, iconEl('edit', 13));
      renameBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const input = h('input', { class: 'input sm', type: 'text', value: tag.name });
        const saveBtn = h('button', { class: 'mini-btn', type: 'button', title: 'Save' }, iconEl('check', 14));
        const commit = () => {
          const v = input.value.trim();
          if (v) { tag.name = v; touchGroup(group.id); save(); }
          drawPopover();
          renderChips();
        };
        saveBtn.addEventListener('click', commit);
        input.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
        row.replaceChildren(input, saveBtn);
        input.focus();
        input.select();
      });

      const delBtn = h('button', { class: 'mini-btn danger', type: 'button', title: 'Delete tag' }, iconEl('trash', 13));
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        confirmDialog({
          title: 'Delete tag?',
          message: `“${tag.name}” will be removed from this group and from every entry using it.`,
          confirmText: 'Delete tag',
          danger: true,
          onConfirm: () => {
            group.tags = group.tags.filter(t => t.id !== tag.id);
            group.entries.forEach(en => {
              en.tags = (en.tags || []).filter(t => t !== tag.id);
            });
            selected = selected.filter(s => s !== tag.id);
            onChange(selected);
            const u = getUI(group.id);
            if (u.filter === tag.id) u.filter = 'all';
            touchGroup(group.id);
            save();
            renderChips();
            if (activePopover) { closePopover(); openBtn.click(); }
            if (currentView === 'home') renderApp();
          }
        });
      });

      const row = h('div', { class: 'tag-row' }, cb, h('span', { class: 'tag-row-name' }, tag.name), renameBtn, delBtn);
      list.append(row);
    });

    content.append(list);

    const input = h('input', { class: 'input sm', type: 'text', placeholder: 'New tag name', maxlength: 30 });
    const addBtn = h('button', { class: 'btn sm primary', type: 'button' }, 'Create');
    const create = () => {
      const v = input.value.trim();
      if (!v) return;
      if (group.tags.some(t => t.name.toLowerCase() === v.toLowerCase())) {
        toast('That tag already exists');
        return;
      }
      const tag = { id: uid(), name: v };
      group.tags.push(tag);
      selected.push(tag.id);
      onChange(selected);
      touchGroup(group.id);
      save();
      renderChips();
      drawPopover();
      input.value = '';
      input.focus();
    };
    addBtn.addEventListener('click', create);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); create(); } });

    content.append(h('div', { class: 'tag-create' }, input, addBtn));
    scheduleRefresh();
  }

  openBtn.addEventListener('click', () => {
    const content = h('div', { class: 'tag-pop' });
    openPopover(openBtn, content);
    if (activePopover) drawPopover();
  });

  renderChips();
  wrap.append(chips, openBtn);
  return wrap;
}

/* ============================================================
   ENTRY OVERLAY
   ============================================================ */
let closeOverlay = () => {};
let overlayFullscreenPref = false;

function openEntryOverlay(group, entry) {
  const root = document.getElementById('overlay-root');
  root.replaceChildren();

  const images = (group.fields.images && entry.images) ? entry.images.slice() : [];
  let ci = 0;

  const ov = h('div', { class: 'overlay' });
  const panel = h('div', { class: 'overlay-panel', 'data-csb': 'y' });

  const closeBtn = h('button', { class: 'icon-btn', type: 'button', title: 'Close' }, iconEl('close', 18));

  const fsBtn = h('button', { class: 'icon-btn', type: 'button' });
  const syncFs = () => {
    const on = ov.classList.contains('fullscreen');
    fsBtn.title = on ? 'Exit full screen' : 'Full screen';
    fsBtn.replaceChildren(iconEl(on ? 'collapse' : 'expand', 18));
    overlayFullscreenPref = on;
    scheduleScrollbars();
  };
  fsBtn.addEventListener('click', () => { ov.classList.toggle('fullscreen'); syncFs(); });
  if (overlayFullscreenPref) ov.classList.add('fullscreen');
  syncFs();

  const editBtn = h('button', { class: 'icon-btn', type: 'button', title: 'Edit entry' }, iconEl('edit', 17));
  editBtn.addEventListener('click', () => {
    pendingEditFullscreen = ov.classList.contains('fullscreen');
    close();
    openEntryModal(group, entry);
  });

  const delBtn = h('button', { class: 'icon-btn danger', type: 'button', title: 'Delete entry' }, iconEl('trash', 17));
  delBtn.addEventListener('click', () => {
    confirmDialog({
      title: 'Delete entry?',
      message: `“${entry.name}” will be moved to the Trash. You can restore it within 30 days.`,
      confirmText: 'Move to Trash',
      danger: true,
      onConfirm: () => { close(); moveEntryToTrash(group, entry); }
    });
  });

  const head = h('div', { class: 'ov-head' },
    h('div', { style: { flex: '1', minWidth: '0' } },
      h('h2', { class: 'ov-title' }, entry.name),
      h('div', { class: 'muted small', style: { marginTop: '4px' } },
        group.name + ' · created ' + fmtDate(entry.createdAt) +
        (entry.updatedAt && entry.updatedAt !== entry.createdAt ? ' · edited ' + fmtDate(entry.updatedAt) : ''))
    ),
    fsBtn, editBtn, delBtn, closeBtn
  );

  const body = h('div', { class: 'ov-body' });

  if (group.fields.description && entry.description) {
    body.append(h('div', { class: 'ov-section' },
      h('div', { class: 'ov-label' }, 'Description'),
      h('div', { class: 'ov-desc' }, entry.description)
    ));
  }

  if (group.fields.url && entry.url) {
    const href = normalizeUrl(entry.url);
    body.append(h('div', { class: 'ov-section' },
      h('div', { class: 'ov-label' }, 'Link'),
      h('a', { class: 'ov-link', href, target: '_blank', rel: 'noopener noreferrer' },
        iconEl('link', 14), entry.url)
    ));
  }

  if (group.fields.location && entry.location) {
    const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(entry.location);
    body.append(h('div', { class: 'ov-section' },
      h('div', { class: 'ov-label' }, 'Location'),
      h('a', { class: 'ov-link', href: mapsUrl, target: '_blank', rel: 'noopener noreferrer' },
        iconEl('pin', 14), entry.location)
    ));
  }

  let showImage = () => {};
  if (images.length) {
    const img = h('img', { src: images[0], alt: '' });
    const counter = h('div', { class: 'ov-counter' }, `1 / ${images.length}`);
    const carousel = h('div', { class: 'ov-carousel' }, img, counter);

    if (images.length > 1) {
      const prev = h('button', { class: 'ov-nav prev', type: 'button', title: 'Previous' }, iconEl('left', 18));
      const next = h('button', { class: 'ov-nav next', type: 'button', title: 'Next' }, iconEl('right', 18));
      prev.addEventListener('click', () => showImage(ci - 1));
      next.addEventListener('click', () => showImage(ci + 1));
      carousel.append(prev, next);
    }

    showImage = (i) => {
      ci = (i + images.length) % images.length;
      img.src = images[ci];
      counter.textContent = `${ci + 1} / ${images.length}`;
    };

    body.append(h('div', { class: 'ov-section' }, carousel));
  }

  if (group.fields.voice && entry.voice) {
    body.append(h('div', { class: 'ov-section' },
      h('div', { class: 'ov-label' }, 'Voice recording'),
      h('audio', { controls: true, src: entry.voice, style: { width: '100%' } })
    ));
  }

  if (group.fields.tags && (entry.tags || []).length) {
    const tagWrap = h('div', { class: 'ov-tags' });
    entry.tags.forEach(id => {
      const t = group.tags.find(x => x.id === id);
      if (t) tagWrap.append(h('span', { class: 'chip' }, t.name));
    });
    if (tagWrap.children.length) {
      body.append(h('div', { class: 'ov-section' },
        h('div', { class: 'ov-label' }, 'Tags'),
        tagWrap
      ));
    }
  }

  if (group.fields.done) {
    const cb = h('input', { type: 'checkbox' });
    cb.checked = !!entry.done;
    cb.addEventListener('change', () => {
      entry.done = cb.checked;
      entry.updatedAt = new Date().toISOString();
      touchGroup(group.id);
      save();
      refreshGroupBody(group.id);
    });
    const sw = h('label', { class: 'switch' }, cb, h('span', { class: 'switch-track' }, h('span', { class: 'switch-thumb' })));
    body.append(h('div', { class: 'ov-section' },
      h('div', { class: 'ov-label' }, 'Status'),
      h('div', { class: 'toggle-row', style: { padding: '0' } },
        h('div', { class: 'toggle-text' }, h('div', { class: 'toggle-name' }, entry.done ? 'Done' : 'Not done')),
        sw
      )
    ));
  }

  if (group.fields.countdown && entry.countdown) {
    body.append(h('div', { class: 'ov-section' },
      h('div', { class: 'ov-label' }, 'Countdown'),
      countdownNode(entry)
    ));
  }

  panel.append(head, body);
  ov.append(panel);
  root.append(ov);
  requestAnimationFrame(() => ov.classList.add('show'));

  const keyHandler = (e) => {
    if (e.key === 'Escape') { close(); return; }
    if (images.length > 1) {
      if (e.key === 'ArrowLeft') showImage(ci - 1);
      if (e.key === 'ArrowRight') showImage(ci + 1);
    }
  };
  document.addEventListener('keydown', keyHandler);

  function close() {
    document.removeEventListener('keydown', keyHandler);
    ov.classList.remove('show');
    setTimeout(() => {
      if (root.firstChild === ov) root.replaceChildren();
      scheduleScrollbars();
    }, 200);
  }
  closeOverlay = close;

  closeBtn.addEventListener('click', close);
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });

  scheduleRefresh();
  setTimeout(scheduleScrollbars, 180);
}
